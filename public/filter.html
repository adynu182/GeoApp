<!DOCTYPE html>
<html>
<head>
  <title>Filter Wilayah - GeoApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div class="mobile-handle" onclick="toggleSidebar()"></div>
  <div class="sidebar-header">
    <h1><i class="fas fa-filter"></i> Filter Wilayah</h1>
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">Pilih kecamatan untuk melihat kelurahan</p>
    
    <div id="controls" style="flex-direction: column; align-items: stretch; gap: 10px;">
      <select id="kecamatan-select" onchange="onKecamatanChange()">
        <option value="">-- Pilih Kecamatan --</option>
      </select>
    </div>
  </div>

  <div class="loader-container" id="loader">
    <div class="spinner"></div>
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;">Memuat data...</p>
  </div>

  <div id="list">
    <div style="text-align:center; padding: 20px; color: var(--text-muted);">
      Silakan pilih kecamatan terlebih dahulu.
    </div>
  </div>
</div>

<!-- Toggle (mobile) -->
<button id="toggleBtn" onclick="toggleSidebar()"><i class="fas fa-list"></i></button>

<!-- Map -->
<div id="map"></div>

<script>
const map = L.map('map', {
  zoomControl: false
}).setView([-6.2, 106.8], 12);

// Tiles
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 20
}).addTo(map);

L.control.zoom({
  position: 'bottomright'
}).addTo(map);

let geoLayer;
let layerMap = {};
let activeLayer = null;

// Load initial kecamatan list
async function init() {
  const select = document.getElementById("kecamatan-select");
  try {
    const res = await fetch('/api/list-kecamatan');
    const data = await res.json();
    
    data.forEach(item => {
      const opt = document.createElement("option");
      opt.value = item.nama_kec;
      opt.textContent = item.nama_kec;
      select.appendChild(opt);
    });
  } catch (err) {
    console.error("Gagal memuat kecamatan:", err);
  }
}

async function onKecamatanChange() {
  const kec = document.getElementById("kecamatan-select").value;
  if (!kec) return;

  const loader = document.getElementById("loader");
  const listContainer = document.getElementById("list");

  loader.style.display = "block";
  listContainer.innerHTML = "";

  if (geoLayer) map.removeLayer(geoLayer);

  try {
    const res = await fetch(`/api/list-kelurahan?kecamatan=${encodeURIComponent(kec)}`);
    const data = await res.json();

    loader.style.display = "none";

    if (data.length === 0) {
      listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">Tidak ada data kelurahan.</div>';
      return;
    }

    geoLayer = L.featureGroup();
    layerMap = {};
    let listHTML = "";

    data.forEach((item, i) => {
      const layer = L.geoJSON(item.geometry, {
        style: {
          color: "#059669",
          weight: 2,
          fillColor: "#10b981",
          fillOpacity: 0.2
        }
      });

      layer.bindPopup(`
        <div class="popup-content">
          <b>${item.nama_kel}</b><br/>
          <span style="font-size: 0.8rem; color: #64748b;">Kec. ${item.nama_kec}</span>
        </div>
      `);

      layer.on({
        mouseover: e => e.target.setStyle({ fillOpacity: 0.5 }),
        mouseout: e => {
          if (activeLayer !== e.target) {
            e.target.setStyle({ fillOpacity: 0.2 });
          }
        },
        click: () => selectItem(i)
      });

      geoLayer.addLayer(layer);
      layerMap[i] = layer;

      listHTML += `
        <div class="item" onclick="selectItem(${i})" id="item-${i}">
          <b>${item.nama_kel}</b>
          <div class="location-info">Kelurahan di Kec. ${item.nama_kec}</div>
        </div>
      `;
    });

    listContainer.innerHTML = listHTML;
    geoLayer.addTo(map);

    if (geoLayer.getLayers().length > 0) {
      map.fitBounds(geoLayer.getBounds(), { padding: [20, 20] });
    }

  } catch (err) {
    loader.style.display = "none";
    console.error(err);
    alert("Gagal memuat data kelurahan");
  }
}

function selectItem(i) {
  const layer = layerMap[i];
  if (!layer) return;

  if (activeLayer) {
    activeLayer.setStyle({ fillOpacity: 0.2, weight: 2 });
  }

  document.querySelectorAll(".item").forEach(el => el.classList.remove("active"));

  layer.setStyle({ fillOpacity: 0.5, weight: 3 });
  layer.openPopup();
  map.fitBounds(layer.getBounds(), { padding: [50, 50] });

  const itemEl = document.getElementById(`item-${i}`);
  itemEl.classList.add("active");
  itemEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  activeLayer = layer;
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

init();
</script>

</body>
</html>
