<!DOCTYPE html>
<html>
<head>
  <title>Peta Wilayah Sekitar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body { margin:0; font-family: Arial; }
    #map { height: 70vh; }
    #controls {
      padding: 10px;
      background: #f5f5f5;
    }
    select, button {
      padding: 8px;
      margin-right: 10px;
    }
  </style>
</head>
<body>

<div id="controls">
  Radius:
  <select id="radius">
    <option value="1000">1 KM</option>
    <option value="3000">3 KM</option>
    <option value="5000" selected>5 KM</option>
    <option value="10000">10 KM</option>
  </select>

  <button onclick="loadData()">🔍 Cari</button>
</div>

<div id="map"></div>

<script>
const map = L.map('map').setView([-6.2, 106.8], 12);

// base map
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let userMarker;
let geoLayer;

// ambil lokasi user
navigator.geolocation.getCurrentPosition((pos) => {
  window.userLat = pos.coords.latitude;
  window.userLon = pos.coords.longitude;

  map.setView([userLat, userLon], 14);

  userMarker = L.marker([userLat, userLon])
    .addTo(map)
    .bindPopup("📍 Lokasi Kamu")
    .openPopup();

  loadData(); // auto load pertama
});

// fungsi load data
async function loadData() {
  const radius = document.getElementById("radius").value;

  if (!window.userLat) {
    alert("Lokasi belum tersedia");
    return;
  }

  // hapus layer lama
  if (geoLayer) {
    map.removeLayer(geoLayer);
  }

  try {
    const res = await fetch(`/api/nearby?lat=${userLat}&lon=${userLon}&radius=${radius}`);
    const data = await res.json();

    geoLayer = L.featureGroup();

    data.forEach(item => {
      const layer = L.geoJSON(item.geometry, {
        style: {
          color: "blue",
          weight: 2,
          fillColor: "orange",
          fillOpacity: 0.4
        }
      });

      // popup saat klik
      layer.bindPopup(`
        <b>${item.nama_kel}</b><br/>
        Kecamatan: ${item.nama_kec}<br/>
        Kota: ${item.nama_kab}
      `);

      // hover effect
      layer.on({
        mouseover: function (e) {
          e.target.setStyle({ fillOpacity: 0.7 });
        },
        mouseout: function (e) {
          e.target.setStyle({ fillOpacity: 0.4 });
        }
      });

      geoLayer.addLayer(layer);
    });

    geoLayer.addTo(map);

    // auto zoom ke semua polygon
    if (geoLayer.getLayers().length > 0) {
      map.fitBounds(geoLayer.getBounds());
    }

  } catch (err) {
    console.error(err);
    alert("Gagal load data");
  }
}
</script>

</body>
</html>
