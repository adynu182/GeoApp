<!DOCTYPE html>
<html>
<head>
  <title>Peta Wilayah Sekitar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div id="controls">
    Radius:
    <select id="radius">
      <option value="1000">1 KM</option>
      <option value="3000">3 KM</option>
      <option value="5000" selected>5 KM</option>
      <option value="10000">10 KM</option>
    </select>
    <button onclick="loadData()">🔍</button>
  </div>

  <div id="list"></div>
</div>

<!-- Toggle (mobile) -->
<div id="toggleBtn" onclick="toggleSidebar()">⬆️ List</div>

<!-- Map -->
<div id="map"></div>

<script>
const map = L.map('map').setView([-6.2, 106.8], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let userLat, userLon;
let userMarker;
let geoLayer;
let layerMap = {};
let activeLayer = null;

// ambil lokasi user
navigator.geolocation.getCurrentPosition((pos) => {
  userLat = pos.coords.latitude;
  userLon = pos.coords.longitude;

  map.setView([userLat, userLon], 14);

  userMarker = L.marker([userLat, userLon])
    .addTo(map)
    .bindPopup("📍 Lokasi Kamu")
    .openPopup();

  loadData();
});

// hitung jarak KM
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2) * Math.sin(dLon/2);

  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

// load data
async function loadData() {
  const radius = document.getElementById("radius").value;

  if (!userLat) return alert("Lokasi belum siap");

  if (geoLayer) map.removeLayer(geoLayer);

  try {
    const res = await fetch(`/api/nearby?lat=${userLat}&lon=${userLon}&radius=${radius}`);
    const data = await res.json();

    if (!Array.isArray(data)) {
      alert("API Error");
      return;
    }

    geoLayer = L.featureGroup();
    layerMap = {};

    let listHTML = "";

    data.forEach((item, i) => {

      const layer = L.geoJSON(item.geometry, {
        style: {
          color: "#1976d2",
          weight: 2,
          fillColor: "#ff9800",
          fillOpacity: 0.3
        }
      });

      const center = layer.getBounds().getCenter();
      const distance = getDistance(userLat, userLon, center.lat, center.lng).toFixed(2);

      layer.bindPopup(`
        <b>${item.nama_kel}</b><br/>
        ${item.nama_kec}<br/>
        ${item.nama_kab}<br/>
        📏 ${distance} KM
      `);

      layer.on({
        mouseover: e => e.target.setStyle({ fillOpacity: 0.6 }),
        mouseout: e => e.target.setStyle({ fillOpacity: 0.3 }),
        click: () => selectItem(i)
      });

      geoLayer.addLayer(layer);
      layerMap[i] = layer;

      listHTML += `
        <div class="item" onclick="selectItem(${i})" id="item-${i}">
          <b>${item.nama_kel}</b><br/>
          ${item.nama_kec}<br/>
          <small>📏 ${distance} KM</small>
        </div>
      `;
    });

    document.getElementById("list").innerHTML = listHTML;

    geoLayer.addTo(map);

    if (geoLayer.getLayers().length > 0) {
      map.fitBounds(geoLayer.getBounds());
    }

  } catch (err) {
    console.error(err);
    alert("Gagal Load Data");
  }
}

// pilih item
function selectItem(i) {
  const layer = layerMap[i];
  if (!layer) return;

  if (activeLayer) {
    activeLayer.setStyle({ fillOpacity: 0.3 });
  }

  document.querySelectorAll(".item").forEach(el => el.classList.remove("active"));

  layer.setStyle({ fillOpacity: 0.7 });
  layer.openPopup();
  map.fitBounds(layer.getBounds());

  document.getElementById(`item-${i}`).classList.add("active");

  activeLayer = layer;

  // mobile auto close
  if (window.innerWidth < 768) {
    document.getElementById("sidebar").classList.remove("open");
  }
}

// toggle sidebar mobile
function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}
</script>

</body>
</html>
