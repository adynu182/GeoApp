<!DOCTYPE html>
<html>
<head>
  <title>Marker Manager - GeoApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    .marker-form {
      padding: 16px;
      background: var(--bg-main);
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      box-sizing: border-box;
      background: var(--surface);
    }
    .auto-info {
      background: #eff6ff;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      border: 1px solid #dbeafe;
    }
    .auto-info b { color: var(--primary); }
    
    hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    .sheet-content {
      padding-top: 8px;
    }
  </style>
</head>
<body>

<!-- Map -->
<div id="map"></div>

<!-- Floating Header -->
<div class="floating-panel">
  <div class="chip-group">
    <div class="chip" onclick="location.href='index.html'">
      <i class="fas fa-location-crosshairs"></i> Sekitar
    </div>
    <div class="chip" onclick="location.href='index.html'">
      <i class="fas fa-filter"></i> Filter
    </div>
    <div class="chip" onclick="location.href='index.html'">
      <i class="fas fa-search"></i> Cari
    </div>
    <div class="chip active">
      <i class="fas fa-map-pin"></i> Marker
    </div>
  </div>
</div>

<!-- Bottom Sheet -->
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle" onclick="toggleSheet()"></div>
  <div class="sheet-content">
    <div class="sheet-title">
      <span>Tambah Marker Baru</span>
      <i class="fas fa-chevron-up" id="sheet-icon" style="font-size: 0.8rem; color: var(--text-muted)"></i>
    </div>

    <div class="marker-form">
      <div id="location-status" class="auto-info">
        <i class="fas fa-sync fa-spin"></i> Mendeteksi lokasi...
      </div>

      <div class="form-group">
        <label>Nama Marker</label>
        <input type="text" id="m-name" placeholder="Contoh: Kantor Desa">
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <select id="m-category">
          <option value="Fasilitas Umum">Fasilitas Umum</option>
          <option value="Bisnis">Bisnis</option>
          <option value="Wisata">Wisata</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>
      <div class="form-group">
        <label>Deskripsi</label>
        <textarea id="m-desc" rows="2" placeholder="Keterangan singkat..."></textarea>
      </div>
      
      <button id="save-btn" style="width: 100%; height: 48px; border-radius: 12px;">
        <i class="fas fa-save" style="margin-right: 8px;"></i> Simpan Marker
      </button>
    </div>

    <hr>

    <div class="sheet-title">
      <span>Daftar Marker Tersimpan</span>
    </div>

    <div id="list">
      <div class="loader-container" id="loader" style="display: block;">
        <div class="spinner"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0pZijSo-v2w-VCmrORb9CowMCBQ6-ws0",
    authDomain: "geo-app-fd860.firebaseapp.com",
    projectId: "geo-app-fd860",
    storageBucket: "geo-app-fd860.firebasestorage.app",
    messagingSenderId: "469722777353",
    appId: "1:469722777353:web:e83f3e2871be2caf0335d8"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // --- UI LOGIC ---
  window.toggleSheet = function() {
    const sheet = document.getElementById('bottomSheet');
    const icon = document.getElementById('sheet-icon');
    if (sheet.classList.contains('expanded')) {
      sheet.classList.remove('expanded');
      icon.className = 'fas fa-chevron-up';
    } else {
      sheet.classList.add('expanded');
      icon.className = 'fas fa-chevron-down';
    }
  };

  window.expandSheet = function() {
    document.getElementById('bottomSheet').classList.add('expanded');
    document.getElementById('sheet-icon').className = 'fas fa-chevron-down';
  };

  // --- MAP SETUP ---
  const map = L.map('map', { zoomControl: false }).setView([-6.2, 106.8], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; CARTO'
  }).addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  let currentPos = null;
  let tempMarker = null;

  // --- LOCATION DETECTION ---
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const { latitude, longitude } = pos.coords;
    currentPos = { lat: latitude, lon: longitude };
    map.setView([latitude, longitude], 15);
    
    if (tempMarker) map.removeLayer(tempMarker);
    tempMarker = L.marker([latitude, longitude], { draggable: true }).addTo(map);
    tempMarker.bindPopup("Geser marker untuk lokasi tepat").openPopup();

    await updateRegionInfo(latitude, longitude);

    tempMarker.on('dragend', async (e) => {
      const { lat, lng } = e.target.getLatLng();
      currentPos = { lat, lon: lng };
      await updateRegionInfo(lat, lng);
    });

  }, (err) => {
    document.getElementById('location-status').innerHTML = "Gagal deteksi GPS";
  });

  async function updateRegionInfo(lat, lon) {
    const statusEl = document.getElementById('location-status');
    statusEl.innerHTML = '<i class="fas fa-sync fa-spin"></i> Mencari wilayah...';
    
    try {
      const res = await fetch(`/api/get-region?lat=${lat}&lon=${lon}`);
      const data = await res.json();
      
      if (data.nama_kel) {
        currentPos.kel = data.nama_kel;
        currentPos.kec = data.nama_kec;
        currentPos.kab = data.nama_kab;
        statusEl.innerHTML = `
          📍 <b>${data.nama_kel}</b>, ${data.nama_kec}<br/>
          <span style="font-size:0.75rem; color: var(--text-muted)">Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}</span>
        `;
      } else {
        statusEl.innerHTML = "Wilayah di luar cakupan data";
      }
    } catch (e) {
      statusEl.innerHTML = "Gagal mengambil data wilayah";
    }
  }

  // --- FIREBASE OPS ---
  document.getElementById('save-btn').onclick = async () => {
    const name = document.getElementById('m-name').value;
    const category = document.getElementById('m-category').value;
    const desc = document.getElementById('m-desc').value;

    if (!name) return alert("Isi nama marker!");
    if (!currentPos || !currentPos.kel) return alert("Lokasi belum terdeteksi!");

    const saveBtn = document.getElementById('save-btn');
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

    try {
      await addDoc(collection(db, "markers"), {
        name,
        category,
        description: desc,
        lat: currentPos.lat,
        lon: currentPos.lon,
        kelurahan: currentPos.kel,
        kecamatan: currentPos.kec,
        kabupaten: currentPos.kab,
        createdAt: new Date()
      });

      document.getElementById('m-name').value = '';
      document.getElementById('m-desc').value = '';
      alert("Marker berhasil disimpan!");
    } catch (e) {
      console.error(e);
      alert("Gagal menyimpan ke Firebase");
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<i class="fas fa-save"></i> Simpan Marker';
    }
  };

  // Listen for markers
  const q = query(collection(db, "markers"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snapshot) => {
    const listContainer = document.getElementById('list');
    listContainer.innerHTML = '';
    
    snapshot.forEach((doc) => {
      const data = doc.data();
      const div = document.createElement('div');
      div.className = 'compact-item';
      div.style.cursor = 'pointer';
      div.innerHTML = `
        <div class="icon"><i class="fas fa-map-pin"></i></div>
        <div class="info">
          <b>${data.name}</b>
          <span>${data.kelurahan}, ${data.kecamatan}</span>
          <div style="font-size:0.75rem; color: var(--primary); font-weight: 600; margin-top: 2px;">${data.category}</div>
        </div>
        <i class="fas fa-chevron-right" style="color: var(--border); font-size: 0.8rem;"></i>
      `;
      div.onclick = () => {
        map.setView([data.lat, data.lon], 17);
        L.marker([data.lat, data.lon]).addTo(map)
          .bindPopup(`<b>${data.name}</b><br>${data.description || ''}`)
          .openPopup();
        
        // Minimize sheet to see map
        if (window.innerWidth < 768) {
          const sheet = document.getElementById('bottomSheet');
          sheet.classList.remove('expanded');
          document.getElementById('sheet-icon').className = 'fas fa-chevron-up';
        }
      };
      listContainer.appendChild(div);
    });

    if (snapshot.empty) {
      listContainer.innerHTML = '<div style="text-align:center; padding:40px 20px; color:var(--text-muted)">Belum ada marker tersimpan.</div>';
    }
  });

  // Initial expand to show form
  setTimeout(() => {
    expandSheet();
  }, 500);
</script>

</body>
</html>
