<!DOCTYPE html>
<html>
<head>
  <title>Cari Wilayah - GeoApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
  <style>
    .search-container {
      position: relative;
      display: flex;
      gap: 8px;
    }
    #search-input {
      flex: 1;
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      outline: none;
    }
    #search-input:focus {
      border-color: var(--primary);
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div class="mobile-handle" onclick="toggleSidebar()"></div>
  <div class="sidebar-header">
    <h1><i class="fas fa-search"></i> Cari Wilayah</h1>

    <div class="nav-menu">
      <a href="index.html" class="nav-link"><i class="fas fa-location-dot"></i> Sekitar</a>
      <a href="filter.html" class="nav-link"><i class="fas fa-filter"></i> Filter</a>
      <a href="search.html" class="nav-link active"><i class="fas fa-search"></i> Cari</a>
      <a href="markers.html" class="nav-link"><i class="fas fa-map-pin"></i> Marker</a>
    </div>

    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">Cari kelurahan, kecamatan, atau kabupaten</p>
    
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Ketik nama wilayah..." onkeyup="handleKeyUp(event)">
      <button onclick="performSearch()"><i class="fas fa-search"></i></button>
    </div>
  </div>

  <div class="loader-container" id="loader">
    <div class="spinner"></div>
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;">Mencari...</p>
  </div>

  <div id="list">
    <div style="text-align:center; padding: 20px; color: var(--text-muted);">
      Masukkan minimal 3 karakter untuk mencari.
    </div>
  </div>
</div>

<!-- Toggle (mobile) -->
<button id="toggleBtn" onclick="toggleSidebar()"><i class="fas fa-list"></i></button>

<!-- Map -->
<div id="map"></div>

<script>
const map = L.map('map', {
  zoomControl: false
}).setView([-6.2, 106.8], 12);

// Tiles
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd',
  maxZoom: 20
}).addTo(map);

L.control.zoom({
  position: 'bottomright'
}).addTo(map);

let geoLayer;
let layerMap = {};
let activeLayer = null;

function handleKeyUp(e) {
  if (e.key === 'Enter') {
    performSearch();
  }
}

async function performSearch() {
  const query = document.getElementById("search-input").value;
  if (query.length < 3) return;

  const loader = document.getElementById("loader");
  const listContainer = document.getElementById("list");

  loader.style.display = "block";
  listContainer.innerHTML = "";

  if (geoLayer) map.removeLayer(geoLayer);

  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
    const data = await res.json();

    loader.style.display = "none";

    if (data.length === 0) {
      listContainer.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">Tidak ada wilayah ditemukan.</div>';
      return;
    }

    geoLayer = L.featureGroup();
    layerMap = {};
    let listHTML = "";

    data.forEach((item, i) => {
      const layer = L.geoJSON(item.geometry, {
        style: {
          color: "#2563eb",
          weight: 2,
          fillColor: "#3b82f6",
          fillOpacity: 0.2
        }
      });

      layer.bindPopup(`
        <div class="popup-content">
          <b>${item.nama_kel}</b><br/>
          <span style="font-size: 0.8rem; color: #64748b;">${item.nama_kec}, ${item.nama_kab}</span>
        </div>
      `);

      layer.on({
        mouseover: e => e.target.setStyle({ fillOpacity: 0.5 }),
        mouseout: e => {
          if (activeLayer !== e.target) {
            e.target.setStyle({ fillOpacity: 0.2 });
          }
        },
        click: () => selectItem(i)
      });

      geoLayer.addLayer(layer);
      layerMap[i] = layer;

      listHTML += `
        <div class="item" onclick="selectItem(${i})" id="item-${i}">
          <b>${item.nama_kel}</b>
          <div class="location-info">${item.nama_kec}, ${item.nama_kab}</div>
        </div>
      `;
    });

    listContainer.innerHTML = listHTML;
    geoLayer.addTo(map);

    if (geoLayer.getLayers().length > 0) {
      map.fitBounds(geoLayer.getBounds(), { padding: [20, 20] });
    }

  } catch (err) {
    loader.style.display = "none";
    console.error(err);
    alert("Gagal melakukan pencarian");
  }
}

function selectItem(i) {
  const layer = layerMap[i];
  if (!layer) return;

  if (activeLayer) {
    activeLayer.setStyle({ fillOpacity: 0.2, weight: 2 });
  }

  document.querySelectorAll(".item").forEach(el => el.classList.remove("active"));

  layer.setStyle({ fillOpacity: 0.5, weight: 3 });
  layer.openPopup();
  map.fitBounds(layer.getBounds(), { padding: [50, 50] });

  const itemEl = document.getElementById(`item-${i}`);
  itemEl.classList.add("active");
  itemEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  activeLayer = layer;
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}
</script>

</body>
</html>
